<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeerStudy - 피어스터디</title>
    <meta name="description" content="PeerStudy - 같은 학교 학생들과 함께 공부하는 웹 앱" />
    
    <!-- 디자인 스타일 -->
    <style>
      :root {
        --bg: #f3f6ff; --card: #ffffff; --primary: #2f5ef7; --primary-soft: #edf1ff;
        --text: #1f2837; --muted: #66738c; --line: #dfe8ff; --shadow: rgba(17, 24, 39, 0.08);
      }
      * { box-sizing: border-box; }
      html, body, #root {
        margin: 0; min-height: 100%; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg); color: var(--text);
      }
      button, input { font: inherit; }
      button { cursor: pointer; }
      .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: 0 8px 18px var(--shadow); margin-bottom: 16px; }
      .signup-card { width: min(760px, 100%); padding: 28px; }
      .logo { font-size: 2.2rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
      h1, h2, h3, p { margin: 0; }
      h1 { font-size: 2rem; margin-bottom: 18px; }
      h2 { font-size: 2rem; margin-bottom: 8px; }
      h3 { font-size: 1.1rem; margin-bottom: 10px; }
      .field-label { display: block; font-weight: 700; margin-top: 18px; margin-bottom: 8px; }
      .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
      .chip { border: none; background: var(--primary-soft); color: var(--text); border-radius: 999px; padding: 9px 14px; font-weight: 600; }
      .chip.selected { background: var(--primary); color: white; }
      .input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: white; outline: none; }
      .primary-button, .secondary-button, .small-button, .send-button { border: none; border-radius: 12px; font-weight: 700; }
      .primary-button { background: var(--primary); color: white; padding: 14px 18px; margin-top: 18px; width: 100%; }
      .secondary-button { background: var(--primary-soft); color: var(--primary); padding: 14px 18px; margin-top: 18px; }
      .small-button { background: var(--primary-soft); color: var(--primary); padding: 10px 12px; min-width: 70px; }
      .small-button.selected { background: var(--primary); color: white; }
      .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
      .content { flex: 1; padding: 18px; max-width: 900px; width: 100%; margin: 0 auto; }
      .header-row { margin-bottom: 14px; }
      .header-row p { color: var(--muted); }
      .big-value { font-size: 2.4rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
      .rank { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
      small { color: var(--muted); }
      .mini-todo { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--text); }
      .dot { width: 10px; height: 10px; border-radius: 999px; background: #dfe8ff; }
      .dot.done { background: var(--primary); }
      .tab-bar { display: grid; grid-template-columns: repeat(5, 1fr); background: white; border-top: 1px solid var(--line); padding: 10px 12px 14px; position: sticky; bottom: 0; width: 100%; }
      .tab-button { background: transparent; border: none; color: var(--muted); font-weight: 700; padding: 10px 8px; border-bottom: 2px solid transparent; }
      .tab-button.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
      .timer-value { font-size: clamp(3rem, 9vw, 5rem); font-weight: 900; color: var(--primary); text-align: center; margin: 20px 0; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      .flex { flex: 1; }
      .todo-list { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
      .todo-item { display: flex; align-items: center; gap: 12px; background: white; border: none; border-radius: 14px; padding: 14px 16px; text-align: left; box-shadow: 0 8px 20px var(--shadow); }
      .todo-item.done { opacity: 0.65; }
      .checkbox { width: 18px; height: 18px; border: 2px solid var(--primary); border-radius: 6px; background: transparent; }
      .checkbox.checked { background: var(--primary); }
      .todo-text { display: flex; flex-direction: column; gap: 3px; }
      .todo-text strong { font-size: 1rem; }
      .todo-text small { color: var(--muted); }
      .stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
      .stat-box { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 8px 18px var(--shadow); display: flex; flex-direction: column; gap: 8px; }
      .stat-box span { color: var(--muted); font-size: 0.85rem; }
      .stat-box strong { font-size: 1.8rem; color: var(--text); }
      .progress-text { font-size: 2.2rem; font-weight: 800; color: var(--primary); margin: 14px 0 10px; }
      .progress-track { width: 100%; height: 12px; background: var(--primary-soft); border-radius: 999px; overflow: hidden; }
      .progress-fill { height: 100%; border-radius: inherit; background: var(--primary); }
      .chat-page { display: flex; flex-direction: column; min-height: 0; }
      .chat-box { flex: 1; background: #eef4ff; border-radius: 16px; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 300px; margin-top: 12px; }
      .chat-bubble { max-width: 75%; padding: 12px 14px; border-radius: 14px; line-height: 1.4; }
      .chat-bubble.me { align-self: flex-end; background: var(--primary); color: white; }
      .chat-bubble.other { align-self: flex-start; background: white; color: var(--text); }
      .chat-input-row { display: flex; gap: 8px; margin-top: 12px; }
      .chat-input { flex: 1; }
      .send-button { background: var(--primary); color: white; padding: 0 16px; min-width: 72px; }
    </style>

    <!-- React 및 실행 도구 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      const schools = [
        "서울중학교",
        "부산중학교",
        "대구중학교",
        "한강중학교",
        "성수중학교",
        "청주중학교"
      ];

      const grades = ["1학년", "2학년", "3학년"];
      const subjects = ["수학", "영어", "국어", "과학", "사회", "기타"];

      const initialTodos = [
        { id: 1, title: "수학 문제집 3문제", subject: "수학", done: false },
        { id: 2, title: "영어 단어 20개", subject: "영어", done: true },
        { id: 3, title: "국어 지문 정리", subject: "국어", done: false },
      ];

      const seedMessages = [
        { id: 1, sender: "other", author: "민서", text: "오늘 수학 문제 3개 풀었어요!" },
        { id: 2, sender: "me", author: "나", text: "좋아요! 저도 20분 더 공부할게요." },
        { id: 3, sender: "other", author: "준호", text: "영어 단어 30개 외우고 있어요." },
      ];

      function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function App() {
        const [screen, setScreen] = useState("signup");
        const [school, setSchool] = useState("서울중학교");
        const [grade, setGrade] = useState("2학년");
        const [nickname, setNickname] = useState("민지");
        const [subject, setSubject] = useState("수학");
        const [timerMinutes, setTimerMinutes] = useState(25);
        const [secondsLeft, setSecondsLeft] = useState(25 * 60);
        const [isRunning, setIsRunning] = useState(false);
        const [totalStudyMinutes, setTotalStudyMinutes] = useState(120);
        const [todos, setTodos] = useState(initialTodos);
        const [draft, setDraft] = useState("");
        const [messages, setMessages] = useState(seedMessages);

        useEffect(() => {
          if (!isRunning) return;
          const interval = setInterval(() => {
            setSecondsLeft((prev) => {
              if (prev <= 1) {
                clearInterval(interval);
                setIsRunning(false);
                setTotalStudyMinutes((m) => m + timerMinutes);
                alert(`${subject} 공부를 완료했어요!`);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(interval);
        }, [isRunning, timerMinutes, subject]);

        const studyRate = useMemo(() => {
          return Math.min(100, Math.round((totalStudyMinutes / 300) * 100));
        }, [totalStudyMinutes]);

        const handleSignup = () => {
          if (!nickname.trim()) {
            alert("닉네임을 입력해주세요.");
            return;
          }
          setScreen("home");
        };

        const toggleTodo = (id) => {
          setTodos((prev) =>
            prev.map((todo) => todo.id === id ? { ...todo, done: !todo.done } : todo)
          );
        };

        const addTodo = () => {
          const next = {
            id: Date.now(),
            title: `${subject} 새 할 일`,
            subject,
            done: false,
          };
          setTodos((prev) => [next, ...prev]);
        };

        const sendMessage = () => {
          if (!draft.trim()) return;
          setMessages((prev) => [
            ...prev,
            { id: Date.now(), sender: "me", author: "나", text: draft.trim() },
          ]);
          setDraft("");
        };

        const resetTimer = () => {
          setIsRunning(false);
          setSecondsLeft(timerMinutes * 60);
        };

        const renderTabs = () => (
          <nav className="tab-bar">
            {[
              { label: "홈", value: "home" },
              { label: "타이머", value: "timer" },
              { label: "할 일", value: "todo" },
              { label: "통계", value: "stats" },
              { label: "채팅", value: "chat" },
            ].map((tab) => (
              <button
                key={tab.value}
                className={`tab-button ${screen === tab.value ? "active" : ""}`}
                onClick={() => setScreen(tab.value)}
              >
                {tab.label}
              </button>
            ))}
          </nav>
        );

        if (screen === "signup") {
          return (
            <div className="page">
              <div className="card signup-card">
                <div className="logo">PeerStudy</div>
                <h1>같은 학교 친구들과 함께 공부해요</h1>

                <label className="field-label">학교 선택</label>
                <div className="chip-group">
                  {schools.map((item) => (
                    <button
                      key={item}
                      className={`chip ${school === item ? "selected" : ""}`}
                      onClick={() => setSchool(item)}
                    >
                      {item}
                    </button>
                  ))}
                </div>

                <label className="field-label">학년 선택</label>
                <div className="chip-group">
                  {grades.map((item) => (
                    <button
                      key={item}
                      className={`chip ${grade === item ? "selected" : ""}`}
                      onClick={() => setGrade(item)}
                    >
                      {item}
                    </button>
                  ))}
                </div>

                <label className="field-label">닉네임</label>
                <input
                  type="text"
                  value={nickname}
                  onChange={(e) => setNickname(e.target.value)}
                  placeholder="닉네임을 입력하세요"
                  className="input"
                />

                <button className="primary-button" onClick={handleSignup}>
                  시작하기
                </button>
              </div>
            </div>
          );
        }

        return (
          <div className="app-shell">
            {screen === "home" && (
              <div className="content">
                <header className="header-row">
                  <div>
                    <h2>오늘의 공부</h2>
                    <p>{school}</p>
                  </div>
                </header>

                <div className="card">
                  <h3>오늘 공부 시간</h3>
                  <div className="big-value">{formatTime(totalStudyMinutes * 60)}</div>
                  <small>이번 주 목표 달성률 {studyRate}%</small>
                </div>

                <div className="card">
                  <h3>우리 학교 랭킹</h3>
                  <div className="rank">#17위 · 2시간 10분</div>
                  <small>같은 학교 학생들과 함께 열심히 공부 중!</small>
                </div>

                <div className="card">
                  <h3>오늘의 할 일</h3>
                  {todos.slice(0, 3).map((todo) => (
                    <div key={todo.id} className="mini-todo">
                      <span className={`dot ${todo.done ? "done" : ""}`} />
                      <span>{todo.title}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {screen === "timer" && (
              <div className="content">
                <h2>타이머</h2>
                <div className="card">
                  <h3>현재 과목</h3>
                  <div className="chip-group">
                    {subjects.map((item) => (
                      <button
                        key={item}
                        className={`chip ${subject === item ? "selected" : ""}`}
                        onClick={() => setSubject(item)}
                      >
                        {item}
                      </button>
                    ))}
                  </div>

                  <div className="timer-value">{formatTime(secondsLeft)}</div>

                  <div className="row">
                    {[15, 25, 50].map((min) => (
                      <button
                        key={min}
                        className={`small-button ${timerMinutes === min ? "selected" : ""}`}
                        onClick={() => {
                          setTimerMinutes(min);
                          setSecondsLeft(min * 60);
                        }}
                      >
                        {min}분
                      </button>
                    ))}
                  </div>

                  <div className="row">
                    <button className="primary-button flex" onClick={() => setIsRunning((p) => !p)}>
                      {isRunning ? "일시정지" : "시작"}
                    </button>
                    <button className="secondary-button flex" onClick={resetTimer}>
                      초기화
                    </button>
                  </div>
                </div>
              </div>
            )}

            {screen === "todo" && (
              <div className="content">
                <h2>오늘 할 일</h2>
                <button className="primary-button" onClick={addTodo}>
                  할 일 추가
                </button>
                <div className="todo-list">
                  {todos.map((todo) => (
                    <button
                      key={todo.id}
                      className={`todo-item ${todo.done ? "done" : ""}`}
                      onClick={() => toggleTodo(todo.id)}
                    >
                      <span className={`checkbox ${todo.done ? "checked" : ""}`} />
                      <span className="todo-text">
                        <strong>{todo.title}</strong>
                        <small>{todo.subject}</small>
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {screen === "stats" && (
              <div className="content">
                <h2>성취도</h2>
                <div className="stats-grid">
                  <div className="stat-box"><span>오늘</span><strong>2h 10m</strong></div>
                  <div className="stat-box"><span>이번 주</span><strong>12h</strong></div>
                  <div className="stat-box"><span>연속</span><strong>7일</strong></div>
                  <div className="stat-box"><span>랭킹</span><strong>#17</strong></div>
                </div>
                <div className="card">
                  <h3>이번 주 목표 달성률</h3>
                  <div className="progress-text">{studyRate}%</div>
                  <div className="progress-track">
                    <div className="progress-fill" style={{ width: `${studyRate}%` }} />
                  </div>
                </div>
              </div>
            )}

            {screen === "chat" && (
              <div className="content chat-page">
                <h2>학교 채팅</h2>
                <div className="chat-box">
                  {messages.map((msg) => (
                    <div key={msg.id} className={`chat-bubble ${msg.sender === "me" ? "me" : "other"}`}>
                      <div>{msg.text}</div>
                    </div>
                  ))}
                </div>
                <div className="chat-input-row">
                  <input
                    type="text"
                    value={draft}
                    onChange={(e) => setDraft(e.target.value)}
                    placeholder="메시지를 입력하세요"
                    className="input chat-input"
                  />
                  <button className="send-button" onClick={sendMessage}>
                    전송
                  </button>
                </div>
              </div>
            )}

            {renderTabs()}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
